<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reckon</title>
    <!-- Matomo -->
    <script>
      /* Skipped on localhost / LAN dev hosts so development traffic does not
         pollute the analytics site. */
      (function() {
        var h = window.location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h === '::1' || h.endsWith('.local')) return;

        /* Beta testers generate very different traffic from real users — lots
           of feature-poking and bug-hunting — so it reports to its own Matomo
           site rather than skewing production's numbers. Unknown hosts fall
           through to production. */
        var siteId = (h === 'beta.reckonio.com') ? '2' : '1';

        var _paq = window._paq = window._paq || [];
        /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        var u="//matomo.benjys.me/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', siteId]);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <!-- End Matomo Code -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
