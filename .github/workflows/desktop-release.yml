name: Desktop release

# Build native installers for macOS / Windows / Linux and attach them to a
# GitHub Release. Triggered two ways:
#   - push a tag like v0.1.0            → cuts a release for that version
#   - Actions tab → Run workflow        → manual, makes a draft release
#
# Testers download the installer for their OS from the Release page.
# NOTE: builds are UNSIGNED — testers will see an "unidentified developer"
# (macOS) or SmartScreen (Windows) warning. That's expected for test builds;
# tell them to right-click → Open (mac) or More info → Run anyway (Windows).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon + Intel via universal target
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Linux: system libs Tauri's webview + bundler need.
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal build needs both arch targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On tag push, cut a release named after the tag. On manual run,
          # tauri-action makes a draft you can publish later.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-{1}', github.run_number, github.sha) }}
          releaseName: "Reckon Desktop ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}"
          releaseBody: "Test build. Unsigned — see the repo's desktop deployment notes for how to open past the OS security prompt."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
